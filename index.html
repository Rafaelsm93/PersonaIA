<style>
/* ===== css/tokens.css ===== */
/* ==================================================================
   TOKENS — a única fonte de verdade visual do produto.
   Trocar a identidade do app inteiro = trocar este arquivo.
   ================================================================== */
:root {
  /* --- Superfícies: preto azulado, não cinza neutro --- */
  --bg-base: #0A0C12;
  --bg-deep: #070810;
  --bg-surface: #12151E;
  --bg-elevated: #1A1F2B;
  --bg-input: #0E111A;

  /* Glassmorphism leve — usado só em barras e no card de decisão */
  --glass: rgba(26, 31, 43, 0.62);
  --glass-border: rgba(255, 255, 255, 0.07);
  --blur: 16px;

  /* --- Marca --- */
  --accent: #3B82F6;
  --accent-2: #8B5CF6;
  --accent-soft: rgba(59, 130, 246, 0.14);
  --gradient: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
  --gradient-soft: linear-gradient(135deg, rgba(59,130,246,.16), rgba(139,92,246,.16));

  /* --- Semântica de mercado --- */
  --up: #10B981;
  --up-soft: rgba(16, 185, 129, 0.13);
  --down: #EF4444;
  --down-soft: rgba(239, 68, 68, 0.13);
  --warn: #F59E0B;
  --warn-soft: rgba(245, 158, 11, 0.13);
  --neutral: #64748B;
  --neutral-soft: rgba(100, 116, 139, 0.14);

  /* --- Texto --- */
  --text-1: #F8FAFC;
  --text-2: #98A3B5;
  --text-3: #626E82;

  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.12);

  /* --- Tipografia ---
     Prosa em fonte de interface; números em monoespaçada tabular.
     A separação é intencional: dados se leem em coluna, texto em linha. */
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI',
             Inter, Roboto, 'Helvetica Neue', system-ui, sans-serif;
  --font-num: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --fs-display: clamp(2rem, 6vw, 2.75rem);
  --fs-h1: clamp(1.4rem, 4vw, 1.75rem);
  --fs-h2: 1.1rem;
  --fs-body: 0.95rem;
  --fs-sm: 0.84rem;
  --fs-xs: 0.75rem;

  --lh-tight: 1.15;
  --lh-body: 1.55;

  /* --- Espaço, raio, sombra --- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 4px 20px rgba(0,0,0,.35);
  --shadow-3: 0 12px 40px rgba(0,0,0,.45);
  --glow: 0 0 0 1px rgba(139,92,246,.25), 0 8px 32px rgba(59,130,246,.12);

  --ease: cubic-bezier(.4, 0, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 480ms;

  --sidebar-w: 248px;
  --bottom-h: 64px;
  --max-w: 1240px;
}

/* Tema claro — preparado, ativável em Configurações numa próxima etapa */
[data-theme='light'] {
  --bg-base: #F6F7FB;
  --bg-deep: #EDEFF5;
  --bg-surface: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-input: #F1F3F9;
  --glass: rgba(255,255,255,.75);
  --glass-border: rgba(0,0,0,.06);
  --text-1: #0B0E14;
  --text-2: #4A5568;
  --text-3: #8A94A6;
  --border: rgba(0,0,0,.08);
  --border-strong: rgba(0,0,0,.14);
}

/* ===== css/reset.css ===== */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html, body { height: 100%; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
img, svg, canvas { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; background: none; border: none; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
table { border-collapse: collapse; width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-2); color: #fff; }

/* ===== css/base.css ===== */
body {
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text-1);
  background: var(--bg-base);
  /* brilho sutil de fundo — dá profundidade sem virar decoração */
  background-image:
    radial-gradient(900px 500px at 12% -10%, rgba(59,130,246,.10), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgba(139,92,246,.10), transparent 55%);
  background-attachment: fixed;
  overscroll-behavior-y: none;
}

h1 { font-size: var(--fs-h1); line-height: var(--lh-tight); letter-spacing: -.02em; font-weight: 650; }
h2 { font-size: var(--fs-h2); line-height: 1.3; letter-spacing: -.01em; font-weight: 620; }
h3 { font-size: var(--fs-body); font-weight: 600; }

p { color: var(--text-2); }

/* Números: monoespaçada tabular, sempre. Colunas de dados alinham. */
.num, .metric-value, .price {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}

.is-up { color: var(--up); }
.is-down { color: var(--down); }
.is-flat { color: var(--text-2); }

.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }

.eyebrow {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: .11em;
  color: var(--text-3);
  font-weight: 600;
}

.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.row { display: flex; align-items: center; gap: var(--sp-3); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  padding: 10px 16px; border-radius: var(--r-pill);
  background: var(--bg-elevated); color: var(--text-1);
  border: 1px solid var(--border-strong);
  font-size: var(--fs-sm); font-weight: 560;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  min-height: 44px;
}
.btn:hover { background: #212736; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--gradient); border: none; color: #fff; box-shadow: 0 4px 16px rgba(59,130,246,.28); }
.btn-primary:hover { filter: brightness(1.08); background: var(--gradient); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--bg-elevated); color: var(--text-1); }
.btn-sm { padding: 6px 12px; min-height: 34px; font-size: var(--fs-xs); }
.btn-danger { color: var(--down); border-color: rgba(239,68,68,.3); }
.btn-danger:hover { background: var(--down-soft); }

/* Campos */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--fs-xs); color: var(--text-2); font-weight: 560; }
.input, select.input {
  background: var(--bg-input); border: 1px solid var(--border-strong);
  border-radius: var(--r-sm); padding: 11px 13px; color: var(--text-1);
  font-family: var(--font-num); font-size: var(--fs-sm); width: 100%;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  min-height: 44px;
}
select.input, .input[type='date'] { font-family: var(--font-ui); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--text-3); }
.field-hint { font-size: var(--fs-xs); color: var(--text-3); }

/* Chips e selos */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--neutral-soft); color: var(--text-2);
  border: 1px solid transparent;
}
.chip--up { background: var(--up-soft); color: var(--up); }
.chip--down { background: var(--down-soft); color: var(--down); }
.chip--warn { background: var(--warn-soft); color: var(--warn); }
.chip--accent { background: var(--accent-soft); color: #93B4FF; }

.stamp { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--text-3); }
.stamp--stale { color: var(--warn); }
.stamp .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.stamp--fresh .dot { background: var(--up); box-shadow: 0 0 8px var(--up); }

hr.sep { border: none; border-top: 1px solid var(--border); margin: var(--sp-4) 0; }

/* ===== css/layout.css ===== */
/* ================= ESTRUTURA ================= */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100dvh;
}

/* ---- Sidebar (desktop) ---- */
.sidebar {
  position: sticky; top: 0; height: 100dvh;
  display: flex; flex-direction: column; gap: var(--sp-2);
  padding: var(--sp-5) var(--sp-3);
  background: var(--bg-deep);
  border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px var(--sp-5); }
.brand img { width: 32px; height: 32px; border-radius: 9px; }
.brand-name { font-weight: 650; letter-spacing: -.02em; font-size: .98rem; }
.brand-sub { font-size: var(--fs-xs); color: var(--text-3); }

.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: var(--r-sm);
  color: var(--text-2); font-size: var(--fs-sm); font-weight: 540;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  position: relative;
}
.nav-item .ico { font-size: 1rem; width: 20px; text-align: center; }
.nav-item:hover { background: var(--bg-surface); color: var(--text-1); }
.nav-item.active { background: var(--accent-soft); color: #fff; }
.nav-item.active::before {
  content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--gradient);
}
.nav-item .phase {
  margin-left: auto; font-size: 10px; padding: 2px 6px; border-radius: var(--r-pill);
  background: var(--bg-elevated); color: var(--text-3); font-weight: 600;
}
.sidebar-footer { margin-top: auto; padding: var(--sp-3) 10px 0; border-top: 1px solid var(--border); }

/* ---- Área principal ---- */
.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
  border-bottom: 1px solid var(--glass-border);
  padding-top: max(var(--sp-3), env(safe-area-inset-top));
}
.topbar h1 { font-size: 1.05rem; }
.topbar-actions { display: flex; align-items: center; gap: var(--sp-2); }

.view {
  flex: 1; width: 100%; max-width: var(--max-w);
  margin: 0 auto; padding: var(--sp-5);
  padding-bottom: calc(var(--sp-7) + env(safe-area-inset-bottom));
}

.grid { display: grid; gap: var(--sp-4); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--sp-3); gap: var(--sp-3); }

/* ---- Barra inferior (mobile) ---- */
.bottom-nav { display: none; }

/* ---- Faixa offline ---- */
.offline-bar {
  display: none; align-items: center; gap: 8px; justify-content: center;
  padding: 7px var(--sp-4); font-size: var(--fs-xs); font-weight: 560;
  background: var(--warn-soft); color: var(--warn);
  border-bottom: 1px solid rgba(245,158,11,.2);
}
body.is-offline .offline-bar { display: flex; }

/* ================= RESPONSIVO ================= */
@media (max-width: 1024px) {
  .grid-main { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .view { padding: var(--sp-4); padding-bottom: calc(var(--bottom-h) + var(--sp-6) + env(safe-area-inset-bottom)); }
  .topbar { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .grid-3, .grid-2 { grid-template-columns: 1fr; }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--glass);
    backdrop-filter: blur(var(--blur)) saturate(150%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
    border-top: 1px solid var(--glass-border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    height: var(--bottom-h); color: var(--text-3); font-size: 10px; font-weight: 600;
    transition: color var(--dur-fast) var(--ease);
  }
  .bottom-item .ico { font-size: 1.15rem; line-height: 1; }
  .bottom-item.active { color: var(--text-1); }
  .bottom-item.active .ico { filter: drop-shadow(0 0 10px rgba(139,92,246,.7)); }
}

@media (max-width: 420px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
}

/* ===== css/animations.css ===== */
/* Micro-animações: só transform e opacity, para manter 60fps. */

@keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { 100% { transform: translateX(100%); } }
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes slide-up { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes track-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.animate-in { animation: fade-up var(--dur-slow) var(--ease-out) both; }
/* Entrada escalonada: a página se monta em sequência, não de uma vez */
.animate-in:nth-child(1) { animation-delay: 0ms; }
.animate-in:nth-child(2) { animation-delay: 45ms; }
.animate-in:nth-child(3) { animation-delay: 90ms; }
.animate-in:nth-child(4) { animation-delay: 135ms; }
.animate-in:nth-child(5) { animation-delay: 180ms; }
.animate-in:nth-child(6) { animation-delay: 225ms; }

/* Skeletons */
.skeleton {
  position: relative; overflow: hidden;
  background: var(--bg-elevated); border-radius: var(--r-sm);
  height: 14px; width: 100%;
}
.skeleton::after {
  content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.055), transparent);
  animation: shimmer 1.4s infinite;
}
.skeleton-card { height: 132px; border-radius: var(--r-lg); }
.skeleton-line { height: 12px; margin-bottom: 8px; }
.skeleton-line.w60 { width: 60%; } .skeleton-line.w40 { width: 40%; } .skeleton-line.w80 { width: 80%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}

/* ===== css/components/card.css ===== */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  box-shadow: var(--shadow-1);
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.card--hover:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-2); }
.card--pad-lg { padding: var(--sp-5); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.card-title { font-size: var(--fs-sm); font-weight: 600; color: var(--text-1); }

/* ---- Card de métrica: valor + leitura. Nunca só o número. ---- */
.metric { display: flex; flex-direction: column; gap: 6px; }
.metric-label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
.metric-value { font-size: 1.5rem; font-weight: 620; line-height: 1.1; }
.metric-reading { font-size: var(--fs-sm); color: var(--text-1); line-height: 1.45; }
.metric-impact { font-size: var(--fs-xs); color: var(--text-2); line-height: 1.5; }
.metric-detail { font-size: var(--fs-xs); color: var(--text-3); }

/* Barra de tom: leitura instantânea da direção, sem precisar ler o texto */
.metric-bar { height: 3px; border-radius: 3px; background: var(--neutral-soft); overflow: hidden; }
.metric-bar i { display: block; height: 100%; width: 100%; transform-origin: left; animation: track-in var(--dur-slow) var(--ease-out) both; }
.metric-bar--up i { background: var(--up); }
.metric-bar--down i { background: var(--down); }
.metric-bar--flat i { background: var(--neutral); }

/* ---- Ajuda contextual (o "?" ao lado do indicador) ---- */
.help {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--bg-elevated); color: var(--text-3);
  font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  cursor: help; flex-shrink: 0;
}
.help:hover { background: var(--accent-soft); color: #93B4FF; }

/* ---- Estado vazio: um convite, não um aviso ---- */
.empty { text-align: center; padding: var(--sp-6) var(--sp-4); }
.empty-icon {
  width: 56px; height: 56px; margin: 0 auto var(--sp-3);
  border-radius: var(--r-lg); background: var(--gradient-soft);
  display: grid; place-items: center; font-size: 1.5rem;
  border: 1px solid var(--border);
}
.empty h3 { margin-bottom: 6px; }
.empty p { font-size: var(--fs-sm); max-width: 42ch; margin: 0 auto var(--sp-4); }

/* ===== css/components/decision.css ===== */
/* ==================================================================
   CARD DE DECISÃO — elemento assinatura do produto.
   Responde "o que devo fazer hoje?" com um veredito em uma frase,
   um placar posicionado numa régua e os motivos que o sustentam.
   ================================================================== */
.decision {
  position: relative; overflow: hidden;
  background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  padding: var(--sp-5);
  box-shadow: var(--shadow-3), var(--glow);
}
/* Halo que assume a cor do veredito */
.decision::before {
  content: ''; position: absolute; inset: -40% 40% 60% -20%;
  background: radial-gradient(closest-side, var(--tone-color, var(--accent)), transparent);
  opacity: .16; pointer-events: none;
}
.decision > * { position: relative; }

.decision[data-tone='up']        { --tone-color: var(--up); }
.decision[data-tone='up-soft']   { --tone-color: #34D399; }
.decision[data-tone='neutral']   { --tone-color: var(--neutral); }
.decision[data-tone='down-soft'] { --tone-color: var(--warn); }
.decision[data-tone='down']      { --tone-color: var(--down); }

.decision-eyebrow { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.decision-verdict {
  font-size: var(--fs-display); font-weight: 680; line-height: 1.08;
  letter-spacing: -.03em; margin-bottom: var(--sp-2);
  background: linear-gradient(180deg, var(--text-1), color-mix(in srgb, var(--tone-color) 55%, var(--text-1)));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.decision-sub { font-size: var(--fs-sm); color: var(--text-2); margin-bottom: var(--sp-4); }

/* --- Régua do placar: de "desfavorável" a "favorável" --- */
.score { margin: var(--sp-4) 0; }
.score-rail {
  position: relative; height: 8px; border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--down) 0%, var(--warn) 30%, var(--neutral) 50%, #34D399 72%, var(--up) 100%);
  opacity: .85;
}
.score-marker {
  position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 3px solid var(--bg-base);
  box-shadow: 0 2px 12px rgba(0,0,0,.6);
  transform: translate(-50%, -50%);
  transition: left var(--dur-slow) var(--ease-out);
}
.score-scale { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10px; color: var(--text-3); letter-spacing: .04em; }
.score-value { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--text-2); }

/* --- Motivos --- */
.reasons { display: flex; flex-direction: column; gap: 10px; margin-top: var(--sp-4); }
.reason { display: flex; gap: 11px; align-items: flex-start; font-size: var(--fs-sm); line-height: 1.5; color: var(--text-1); }
.reason .ico {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 9px;
  display: grid; place-items: center; font-size: .85rem;
  background: var(--bg-elevated); border: 1px solid var(--border);
}
.reason[data-tone='up'] .ico { background: var(--up-soft); border-color: transparent; }
.reason[data-tone='down'] .ico { background: var(--down-soft); border-color: transparent; }

/* --- O que mudaria a leitura: o compromisso de honestidade --- */
.invalidation {
  margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md); background: rgba(255,255,255,.035);
  border-left: 2px solid var(--tone-color, var(--accent));
  font-size: var(--fs-xs); color: var(--text-2); line-height: 1.55;
}
.invalidation strong { color: var(--text-1); font-weight: 600; }

.decision-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-4); flex-wrap: wrap; }
.disclaimer { font-size: 11px; color: var(--text-3); line-height: 1.5; max-width: 60ch; }

@media (max-width: 640px) {
  .decision { padding: var(--sp-4); border-radius: var(--r-lg); }
}

/* ===== css/components/market.css ===== */
/* ---- Linha de ativo ---- */
.asset-row {
  display: grid; grid-template-columns: 38px 1fr auto auto; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3); border-radius: var(--r-md);
  transition: background var(--dur-fast) var(--ease);
  cursor: pointer;
}

/* ===== css/components/simulator.css ===== */

            setPref("onboardingDone", true);
          }
        },
        "Instalar"
      )
    );
    document.body.appendChild(bar);
    setTimeout(() => bar.remove(), 15e3);
  }
  function offerIOSInstall() {
    const bar = h(
      "div",
      { class: "update-bar", style: { top: "auto", bottom: "calc(84px + env(safe-area-inset-bottom))", maxWidth: "92vw" } },
      h("span", { class: "xs" }, 'Toque em Compartilhar e depois em "Adicionar \xE0 Tela de In\xEDcio"'),
      h("button", { onClick: () => {
        setPref("onboardingDone", true);
        bar.remove();
      } }, "Ok")
    );
    document.body.appendChild(bar);
  }

  // js/main.js
  init_store();
  init_prefs();
  init_event_bus();
  init_logger();
  init_fallback_store();
  async function boot() {
    const root = document.getElementById("app");
    root.replaceChildren();
    document.documentElement.dataset.theme = getPref("theme");
    const { view } = buildShell(root);
    wireFeedback();
    document.body.classList.remove("booting");
    initRouter(view);
    try {
      await Promise.all([hydrateFromCache(), loadPortfolio(), hydrateNews()]);
      recomputePositions();
    } catch (err) {
      log("boot", "sem dados locais ainda", err);
    }
    subscribe((slice) => {
      if (slice === "market") recomputePositions();
    });
    setState("ui", { online: navigator.onLine });
    startScheduler();
    if (location.protocol.startsWith("http")) {
      registerServiceWorker();
      wireBackgroundMessages();
    }
    setupPullToRefresh();
    warnIfStorageLimited();
    log("boot", "aplica\xE7\xE3o pronta");
  }
  function warnIfStorageLimited() {
    if (!usingFallback()) return;
    emit(EVENTS.TOAST, {
      text: fallbackPersists() ? "Modo compatibilidade: seus dados est\xE3o salvos, mas em um espa\xE7o menor do navegador." : "Aten\xE7\xE3o: neste modo o navegador n\xE3o deixa salvar dados. O que voc\xEA registrar some ao fechar. Publique o arquivo em um endere\xE7o na internet para salvar de verdade.",
      tone: "warn",
      timeout: fallbackPersists() ? 6e3 : 0,
      actionLabel: "Entendi",
      action: () => {
      }
    });
  }
  function setupPullToRefresh() {
    let startY = 0;
    let pulling = false;
    window.addEventListener(
      "touchstart",
      (e) => {
        if (window.scrollY === 0) {
          startY = e.touches[0].clientY;
          pulling = true;
        }
      },
      { passive: true }
    );
    window.addEventListener(
      "touchmove",
      (e) => {
        if (!pulling) return;
        if (e.touches[0].clientY - startY > 90) {
          pulling = false;
          emit(EVENTS.TOAST, { text: "Atualizando\u2026", timeout: 1200 });
          refreshNow();
        }
      },
      { passive: true }
    );
    window.addEventListener("touchend", () => {
      pulling = false;
    }, { passive: true });
  }
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
</body>
</html>
